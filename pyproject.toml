[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-hub"
version = "0.1.0"
description = "Repository-agnostic LangGraph workspace host."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-cli[inmem]>=0.4,<1",
  "pydantic>=2.0,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
agent-hub-bootstrap = "agent_hub.gateway.cli:main"
agent-hub-code-worker = "agent_hub.gateway.code_worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]
